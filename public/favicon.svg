<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="QuickDecorIdeas">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9C7A8"/>
      <stop offset="1" stop-color="#BCA680"/>
    </linearGradient>
  </defs>
  <!-- Gold rounded square background -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="9" fill="url(#gold)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Magnifier icon scaled to 32x32 grid -->
  <circle cx="14" cy="14" r="5.5" stroke="#1B1B1B" stroke-opacity="0.9" stroke-width="2" fill="none"/>
  <line x1="18.2" y1="18.2" x2="23" y2="23" stroke="#1B1B1B" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
</svg>
